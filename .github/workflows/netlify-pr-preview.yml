name: Netlify PR Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: netlify-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy PR preview
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PR preview
        run: npm run build

      - name: Install Netlify CLI
        run: npm install --global netlify-cli@26.1.0

      - name: Deploy to Netlify preview
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 0ed821be-c897-4f15-ad17-859ae866ca1d
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${NETLIFY_AUTH_TOKEN}" ]; then
            echo "::error::Missing required NETLIFY_AUTH_TOKEN secret."
            exit 1
          fi

          deploy_output="${RUNNER_TEMP}/netlify-pr-preview.json"
          # Stable pr-* aliases run as Netlify branch deploy contexts
          # (branch pr-*), not true deploy-preview contexts. Keep
          # --context deploy-preview out unless Netlify runtime env behavior is
          # revalidated for function secrets.
          netlify deploy \
            --dir=dist \
            --site "${NETLIFY_SITE_ID}" \
            --alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} preview ${PR_HEAD_SHA}" \
            --json | tee "${deploy_output}"

          preview_url="$(node - "${deploy_output}" <<'NODE'
          const fs = require('node:fs')

          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const previewUrl =
            payload.deploy_ssl_url ??
            payload.deploy_url ??
            payload.deployUrl ??
            payload.url ??
            payload.ssl_url

          if (!previewUrl) {
            console.error('Netlify deploy output did not include a preview URL.')
            process.exit(1)
          }

          console.log(previewUrl)
          NODE
          )"

          echo "preview-url=${preview_url}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Netlify PR Preview"
            echo
            echo "Preview URL: ${preview_url}"
            echo
            echo "Alias: pr-${PR_NUMBER}"
            echo "Commit: ${PR_HEAD_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment preview URL on PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          const marker = '<!-- netlify-pr-preview -->'
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/')
          const issueNumber = process.env.PR_NUMBER
          const token = process.env.GITHUB_TOKEN
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${token}`,
            'content-type': 'application/json',
            'x-github-api-version': '2022-11-28',
          }
          const body = [
            marker,
            '### Netlify PR Preview',
            '',
            `Preview URL: ${process.env.PREVIEW_URL}`,
            '',
            `Commit: \`${process.env.PR_HEAD_SHA}\``,
            `Workflow run: ${process.env.RUN_URL}`,
            '',
          ].join('\n')

          const request = async (url, options = {}) => {
            const response = await fetch(url, {
              ...options,
              headers: { ...headers, ...options.headers },
            })

            if (!response.ok) {
              const text = await response.text()
              throw new Error(`${options.method ?? 'GET'} ${url} failed: ${response.status} ${text}`)
            }

            return response.status === 204 ? null : response.json()
          }

          const comments = []
          for (let page = 1; ; page += 1) {
            const pageComments = await request(
              `https://api.github.com/repos/${owner}/${repo}/issues/${issueNumber}/comments?per_page=100&page=${page}`,
            )
            comments.push(...pageComments)
            if (pageComments.length < 100) {
              break
            }
          }

          const existing = comments.find((comment) => comment.body?.includes(marker))

          if (existing) {
            await request(existing.url, {
              method: 'PATCH',
              body: JSON.stringify({ body }),
            })
          } else {
            await request(
              `https://api.github.com/repos/${owner}/${repo}/issues/${issueNumber}/comments`,
              {
                method: 'POST',
                body: JSON.stringify({ body }),
              },
            )
          }
          NODE
