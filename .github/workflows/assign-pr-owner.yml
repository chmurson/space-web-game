name: Assign PR owner

on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  pull-requests: write

jobs:
  assign-owner:
    name: Assign repository owner
    if: ${{ !contains(github.event.pull_request.assignees.*.login, 'chmurson') }}
    runs-on: ubuntu-latest

    steps:
      - name: Assign repository owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/assignees" \
            -f 'assignees[]=chmurson' \
            --silent
